<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a" />
      <stop offset="50%" stop-color="#0a1329" />
      <stop offset="100%" stop-color="#0e1b38" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Target / Radar Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#redGrad)" stroke-width="4" opacity="0.8" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="96" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="416" x2="256" y2="466" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
  <line x1="46" y1="256" x2="96" y2="256" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
  <line x1="416" y1="256" x2="466" y2="256" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />

  <!-- Inner Globe / Ground Zero Core -->
  <circle cx="256" cy="256" r="92" fill="#0f172a" stroke="#334155" stroke-width="3" />
  <circle cx="256" cy="256" r="28" fill="url(#redGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />

  <!-- GZ Monogram & Satellite Arcs -->
  <path d="M 200 170 A 95 95 0 0 1 312 170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  <path d="M 180 342 A 95 95 0 0 0 332 342" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- Ground Zero News Text Mark -->
  <text x="256" y="398" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="6">GROUND ZERO</text>
  <text x="256" y="424" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#ef4444" letter-spacing="10">NEWS</text>
</svg>
