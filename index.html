<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ground Zero News – Truth First. News Everywhere.</title>
    <meta name="description" content="Ground Zero News delivers verified, breaking international and regional news with AI-powered multilingual reporting across 19 languages." />
    
    <!-- AI Studio iFrame: Ignore harmless Vite HMR WebSocket connection notices -->
    <script>
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    
    <!-- OpenGraph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ground Zero News" />
    <meta property="og:title" content="Ground Zero News – Truth First. News Everywhere." />
    <meta property="og:description" content="Verified breaking news, global affairs, technology, regional updates, and investigative reports powered by AI in 19 languages." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@GroundZeroNews" />
    <meta name="twitter:title" content="Ground Zero News – Truth First. News Everywhere." />
    <meta name="twitter:description" content="Verified breaking news, global affairs, technology, regional updates, and investigative reports powered by AI in 19 languages." />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0a1128" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ground Zero" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Google Fonts for Editorial News Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org NewsMediaOrganization Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "Ground Zero News",
      "url": "https://groundzeronews.org",
      "logo": "https://groundzeronews.org/icon.svg",
      "slogan": "Truth First. News Everywhere.",
      "publishingPrinciples": "https://groundzeronews.org/editorial-guidelines",
      "correctionsPolicy": "https://groundzeronews.org/corrections-policy",
      "diversityPolicy": "https://groundzeronews.org/diversity-policy",
      "ethicsPolicy": "https://groundzeronews.org/ethics-policy",
      "verificationFactCheckingPolicy": "https://groundzeronews.org/fact-checking-policy",
      "sameAs": [
        "https://twitter.com/GroundZeroNews",
        "https://t.me/GroundZeroNewsOfficial",
        "https://facebook.com/GroundZeroNews"
      ]
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070b14] dark:text-slate-100 antialiased selection:bg-red-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
